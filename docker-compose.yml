services:
  # Was localstack/localstack:3.8. Swapped for MiniStack (MIT, ministack.org)
  # after LocalStack's ~500MB RAM footprint OOM'd Render's free-tier 512MB
  # instance in production (see Phase 8 note below) — MiniStack is a
  # documented drop-in replacement for the services this project uses
  # (same SERVICES=/port 4566/credential-agnostic conventions, boto3 needs
  # no changes), at ~30MB idle. Service/container name kept as
  # "localstack"/"cloudlab-localstack" rather than renamed, since the
  # deployed API's AWS_ENDPOINT_URL and CORS config reference that name —
  # see render.yaml.
  localstack:
    image: ministackorg/ministack:1.5.9
    container_name: cloudlab-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs,dynamodb
      - DEFAULT_REGION=us-east-1
    healthcheck:
      # MiniStack answers its own /_ministack/health, but also serves
      # /_localstack/health for drop-in compatibility with tooling (like
      # this healthcheck) written against LocalStack's API surface.
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:4566/_localstack/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    build:
      context: .
    container_name: cloudlab-api
    ports:
      - "8000:8000"
    environment:
      - CLOUD_PROVIDER=localstack
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT_URL=http://localstack:4566
      - LOG_LEVEL=INFO
    volumes:
      - ./app:/app/app
    depends_on:
      localstack:
        condition: service_healthy
