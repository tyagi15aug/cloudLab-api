[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudctl"
version = "0.1.0"
description = "Developer CLI for the Cloud Control Plane local environment (Phase 7)."
requires-python = ">=3.10"
dependencies = []

# Deliberately zero third-party dependencies (see README.md's "Why
# stdlib-only" note) — cloudctl only needs urllib (HTTP) and subprocess
# (docker compose / the repo's own scripts), both in the standard library.

[project.scripts]
cloudctl = "cloudctl.__main__:main"

[tool.setuptools.packages.find]
include = ["cloudctl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
