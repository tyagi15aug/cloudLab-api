# For a real VM (e.g. an Oracle Cloud Always Free instance), not Render.
# Run with: docker compose -f docker-compose.prod.yml up -d
#
# Differences from docker-compose.yml (local dev):
# - No source bind-mount / --reload (runs the built image as-is)
# - Adds Caddy for TLS termination + reverse proxy
# - restart: unless-stopped, and LocalStack persists across restarts
#   (PERSISTENCE=1) since this is a real always-on box, not a free-tier
#   service that's ephemeral by design
services:
  localstack:
    image: localstack/localstack:3.8
    container_name: cloudlab-localstack
    restart: unless-stopped
    environment:
      - SERVICES=s3,sqs,dynamodb
      - DEBUG=0
      - DEFAULT_REGION=us-east-1
      - PERSISTENCE=1
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    build:
      context: .
    container_name: cloudlab-api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      - CLOUD_PROVIDER=localstack
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT_URL=http://localstack:4566
      - LOG_LEVEL=INFO
      # Set to cloudlab-ui's real URL once you know it (it stays on Render
      # static hosting — free, no reason to move it to this VM too).
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
    depends_on:
      localstack:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: cloudlab-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  localstack_data:
  caddy_data:
  caddy_config:
