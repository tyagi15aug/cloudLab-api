name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy app --ignore-missing-imports

      - name: Unit tests
        run: pytest tests --ignore=tests/integration --cov=app --cov-report=term-missing

      - name: Integration tests
        # Real LocalStackProvider/app over real HTTP against a moto-server
        # process (stands in for a LocalStack container — see
        # tests/integration/conftest.py for why).
        run: pytest tests/integration -v

      - name: CLI - install cloudctl
        # Separate installable package (Phase 7, cli/) — zero third-party
        # dependencies, see cli/README.md.
        run: pip install -e cli/

      - name: CLI - type check
        run: mypy cli/cloudctl --ignore-missing-imports

      - name: CLI - tests
        working-directory: cli
        run: pytest tests -v

      - name: Build Docker image
        run: docker build -t cloudlab-api .
